name: Deploy multi-robot simulator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate simulator and deployment paths
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static deployment paths
        run: npm run test:pages
      - name: Validate collaboration assets, project paths and task contracts
        run: |
          npm run test:collab:pages
          npm run verify:collab:visuals
          npm run test:collab:bins
      - name: Exercise the shared-world collaboration workflow
        env:
          BIN_COUNT: '4'
          TIMEOUT_MS: '900000'
          REPORT: work/validation/collab/release-bin-physical.json
        run: npm run test:collab:bin-core
      - name: Run physical grasping regressions
        run: npm test
      - name: Verify saved acceptance evidence
        run: |
          npm run test:acceptance
          node work/verify-acceptance.mjs
          node work/verify-g1-acceptance.mjs --physics-only
          node work/verify-c5-acceptance.mjs --physics-only
      - name: Preserve current source-bound validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-performance-v4-evidence
          path: |
            work/validation/performance-v4/*-final.json
            work/validation/performance-v4/*-contracts.json
            work/validation/performance-v4/planning-ik-paired.json
            work/validation/collab/release-bin-physical.json
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Publish static site
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
