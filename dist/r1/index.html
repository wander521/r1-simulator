<button id="toggle-camera-views" class="camera-power-switch" role="switch" aria-checked="true">隐藏画面</button>
</div>
<div class="camera-toolbar">
<div class="camera-layout-switch">
<button id="camera-layout-row" class="active" aria-pressed="true">并排</button><button id="camera-layout-column" aria-pressed="false">上下排列</button>
</div>
<button id="toggle-camera-model" class="camera-model-switch" role="switch" aria-checked="true">隐藏相机模型</button>
</div>
<div class="camera-feed-grid" id="camera-feed-grid">
<article class="camera-feed is-live"><div class="camera-feed-heading">
<span>全局俯视相机</span><span class="camera-mode-badge">RGB</span>
</div>
<div class="camera-screen"><canvas id="overhead-camera-canvas" width="320" height="240"></canvas></div></article><article class="camera-feed is-live"><div class="camera-feed-heading">
<span>R1 腕部相机 · RGB</span><span class="camera-mode-badge">RGB</span>
</div>
<div class="camera-screen"><canvas id="wrist-camera-canvas" width="320" height="240"></canvas></div></article>
</div></section>
<section class="control-card grasp-controls" id="grasp-controls"><div class="control-card-heading">
<h2>一键抓取演示</h2>
<span class="feature-badge">AUTO</span>
</div>
<p class="control-hint">&#21452;&#33218;&#20808;&#23637;&#24320;&#65292;&#36527;&#24178;&#21069;&#20542;&#19979;&#36466;&#65307;&#36873;&#23450;&#19968;&#20391;&#30340;&#24179;&#34892;&#22841;&#29226;&#25235;&#21462;&#26041;&#22359;&#24182;&#24402;&#20301;&#12290;</p>
<div class="vision-targets"><button class="vision-target active" type="button" aria-pressed="true"><i class="target-blue"></i><span>&#38738;&#33394;&#26041;&#22359;</span></button></div>
<div class="grasp-actions">
<button id="start-grasp" type="button">▶ 归位</button><button id="start-stack" type="button" hidden>▲ 叠叠乐</button><button id="cancel-grasp" type="button" disabled>停止</button>
</div>
<div class="grasp-progress-row">
<progress id="grasp-progress" max="1" value="0"></progress><output id="grasp-progress-value">0%</output>
</div>
<p class="grasp-stage"><span>阶段</span><strong id="grasp-stage" aria-live="polite">就绪</strong></p></section>
<section class="control-card telemetry-controls"><div class="control-card-heading">
<h2>接触与受力</h2>
<button id="toggle-contact-visuals" role="switch" aria-checked="true">隐藏接触点</button>
</div>
<div class="telemetry-metrics">
<div>
<span>接触数</span><strong id="contact-count">0</strong>
</div>
<div>
<span>夹持力</span><strong id="grasp-force">0.0 N</strong>
</div>
<div>
<span>腕部位置误差</span><strong id="rms-error">— mm</strong>
</div>
</div>
<div class="torque-bars" id="torque-bars"></div>
<div class="telemetry-chart">
<span>关节力矩曲线 · N·m</span><canvas id="torque-chart" width="276" height="88"></canvas>
</div>
<div class="telemetry-chart">
<span>关节误差曲线 · rad</span><canvas id="error-chart" width="276" height="88"></canvas>
</div></section></aside></main><script type="module" src="./r1-app.mjs?v=20261018-perf-4"></script>
